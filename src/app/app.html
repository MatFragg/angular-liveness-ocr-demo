<div class="app-container">
  <!-- Indicador de pasos -->
  <div class="steps-header">
    <div class="steps-container">
      <div class="step-item" [class.completed]="isStepCompleted('dni-capture')" [class.active]="isStepActive('dni-capture')">
        <div class="step-circle">
          <span *ngIf="!isStepCompleted('dni-capture')">1</span>
          <span *ngIf="isStepCompleted('dni-capture')">✓</span>
        </div>
        <div class="step-label">Captura de DNI</div>
        <div class="step-connector"></div>
      </div>
      
      <div class="step-item" [class.completed]="isStepCompleted('liveness')" [class.active]="isStepActive('liveness')">
        <div class="step-circle">
          <span *ngIf="!isStepCompleted('liveness')">2</span>
          <span *ngIf="isStepCompleted('liveness')">✓</span>
        </div>
        <div class="step-label">Verificación de Vida</div>
        <div class="step-connector"></div>
      </div>
      
      <div class="step-item" [class.completed]="isStepCompleted('choice')" [class.active]="isStepActive('choice')">
        <div class="step-circle">
          <span *ngIf="!isStepCompleted('choice')">3</span>
          <span *ngIf="isStepCompleted('choice')">✓</span>
        </div>
        <div class="step-label">Elegir Opción</div>
        <div class="step-connector"></div>
      </div>
      
      <!-- Nuevo paso para comparación DNI -->
      <div class="step-item" 
           [class.completed]="isStepCompleted('compare-dni') || isStepCompleted('reniec-validation')" 
           [class.active]="isStepActive('compare-dni')">
        <div class="step-circle">
          <span *ngIf="!(isStepCompleted('compare-dni') || isStepCompleted('reniec-validation'))">4</span>
          <span *ngIf="isStepCompleted('compare-dni') || isStepCompleted('reniec-validation')">✓</span>
        </div>
        <div class="step-label">Comparación Facial</div>
        <div class="step-connector"></div>
      </div>
      
      <div class="step-item" 
           [class.completed]="isStepCompleted('completed')" 
           [class.active]="isStepActive('completed') || isStepActive('reniec-validation')">
        <div class="step-circle">
          <span *ngIf="!isStepCompleted('completed')">5</span>
          <span *ngIf="isStepCompleted('completed')">✓</span>
        </div>
        <div class="step-label">
          {{ isStepActive('reniec-validation') ? 'Validación RENIEC' : 'Paso Final' }}
        </div>
      </div>
    </div>
  </div>

  <!-- Contenido del paso actual -->
  <div class="step-content">
    <!-- Toggle de método de captura (solo visible en paso dni-capture) -->
    <div *ngIf="currentStep === 'dni-capture'" class="capture-method-toggle">
      <button class="toggle-button" (click)="toggleCaptureMethod()" [class.active]="useReactiveScanner">
        <span class="toggle-icon">{{ useReactiveScanner ? '🤖' : '📷' }}</span>
        <span class="toggle-text">
          {{ useReactiveScanner ? 'Scanner Reactivo (OpenCV)' : 'Captura Tradicional (Countdown)' }}
        </span>
        <span class="toggle-hint">Click para cambiar método</span>
      </button>
    </div>

    <!-- Componentes de captura DNI (alternables) -->
    <app-dni-capture *ngIf="currentStep === 'dni-capture' && !useReactiveScanner"></app-dni-capture>
    <app-dni-scanner-capture *ngIf="currentStep === 'dni-capture' && useReactiveScanner"></app-dni-scanner-capture>
    
    <!-- Resto de componentes del flujo -->
    <app-face-liveness-wrapper *ngIf="currentStep === 'liveness'"></app-face-liveness-wrapper>
    <app-choice-panel *ngIf="currentStep === 'choice'"></app-choice-panel>
    <app-compare-dni *ngIf="currentStep === 'compare-dni'"></app-compare-dni>
    <app-reniec-extract *ngIf="currentStep === 'reniec-validation'"></app-reniec-extract>
    
    <div *ngIf="currentStep === 'completed'" class="completion-message">
      <div class="success-icon">✓</div>
      <h2>¡Proceso Completado!</h2>
      <p>La validación se ha completado exitosamente.</p>
      <button (click)="appState.resetToStart()" class="btn-restart">
        Iniciar Nuevo Proceso
      </button>
    </div>
  </div>
</div>
