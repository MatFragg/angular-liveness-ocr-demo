<div class="scanner-container">
  <!-- Loading State -->
  @if (isLoading()) {
  <div class="loading-container">
    <mat-icon class="loading-spinner">hourglass_empty</mat-icon>
    <p>Iniciando cámara...</p>
  </div>
  }

  <!-- Error State -->
  @if (errorMessage()) {
  <div class="error-container">
    <mat-icon>error</mat-icon>
    <p>{{ errorMessage() }}</p>
    <button mat-raised-button color="warn" (click)="stopCamera()">Cerrar</button>
  </div>
  }

  <!-- Scanner Active -->
  @if (!isLoading() && !errorMessage()) {
  <!-- Video Container con Overlay -->
  <div class="video-wrapper">
    <!-- Video Stream -->
    <video #videoElement autoplay playsinline muted></video>

    <!-- Overlay con Marco Guía -->
    <div class="overlay">
      <!-- Marco Rectangular para DNI -->
      <div class="guide-frame" [class.ready]="isReadyToCapture()">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <!-- Label informativo -->
        <div class="frame-label">
          <span>Coloca tu DNI aquí</span>
        </div>
      </div>
    </div>

    <!-- Canvas Oculto para Análisis -->
    <canvas #canvasElement style="display: none"></canvas>
  </div>

  <!-- Feedback Messages -->
  <div class="feedback-container">
    <div
      class="feedback-message"
      [class.warning]="isBlurry() || isTooFar()"
      [class.success]="isReadyToCapture()"
      [class.info]="!isBlurry() && !isTooFar() && !isReadyToCapture()"
    >
      <mat-icon>{{ getFeedbackIcon() }}</mat-icon>
      <span>{{ feedbackMessage() }}</span>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions">
    <button
      mat-raised-button
      color="primary"
      [disabled]="!isReadyToCapture()"
      (click)="captureImage()"
    >
      <mat-icon>camera</mat-icon>
      Capturar DNI
    </button>

    <button mat-stroked-button (click)="stopCamera()">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
  </div>
  }
</div>
